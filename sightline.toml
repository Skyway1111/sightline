# The config `cargo xtask check`'s `own-gate` stage audits this tree with
# (criterion 12); a Cargo root has no pyproject to hang the table off.
[tool.sightline]
# the binary is the product and every reader is in this tree, so a symbol only
# tests reach is dead (#56) or scaffolding under a marker.
published = false
# `catalog` holds the #12 and #41 exemplar pairs: data the two catalog
# checkers read, whose slow side is written unannotated and unreferenced on
# purpose.
excludes = ["catalog"]
# no hot-roots: family P reads Python and this tree keeps no Python modules

# What the Rust oracle expects on PATH, the one home for the pin
# (`oracle/cargo.rs:pinned` embeds this file). A version off it is a header
# note, never a failure. rust-analyzer runs in process, so it is not here;
# `oracle/cargo.rs:RA_AP` names the `ra_ap_*` version the binary compiled in.
[tool.sightline.rust-toolchain]
cargo = "1.98.0"
