# The pinned corpus: one row per tree every measurement reads, in ladder
# order. Python first, then Rust; per language the clean pole, the mid repo,
# the scale repo.
#
# `name` is the sibling directory of this workspace and the stem of every
# file a run writes. `url` is the public repository to clone it from, which
# `name` need not match. `config` is a path under the workspace root; a row
# without one audits with the tree's own settings. `pin` is the commit the
# recorded walls were measured at: `audit-bench` stops rather than print a
# wall for a tree that has moved off it (`benchmarks.md`, "Reference machine").

[[repo]]
name = "powertools-lambda-python"
url = "https://github.com/aws-powertools/powertools-lambda-python"
lang = "py"
role = "clean"
pin = "a39e1018e36b7965b08313288bea3b7420df5220"

