[package]
name = "sightline-lint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A linter for code an agent wrote: findings ranked by what they are worth"

[[bin]]
name = "sightline"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
camino.workspace = true
clap = { workspace = true, features = ["derive"] }
indexmap.workspace = true
mimalloc = "0.1"
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sightline-core = { version = "0.3.0", path = "../core" }
sightline-py-facts = { version = "0.3.0", path = "../py-facts" }
sightline-py-provers = { version = "0.3.0", path = "../py-provers" }
sightline-py-rules = { version = "0.3.0", path = "../py-rules" }
sightline-rs-facts = { version = "0.3.0", path = "../rs-facts" }
sightline-rs-provers = { version = "0.3.0", path = "../rs-provers" }
sightline-rs-rules = { version = "0.3.0", path = "../rs-rules" }
tempfile = "3"
toml.workspace = true

[dev-dependencies]
sightline-testkit = { path = "../testkit" }

[lints]
workspace = true
