# The fence: a rule reads facts and provers.
# It never touches the filesystem, the environment, a process or a parser.
# Clippy reads the nearest clippy.toml walking up from the crate directory,
# so this file binds this crate alone.
#
# The rs-rules copy holds the same list. Naming a path no dependency of this
# crate holds makes clippy warn about the config, so no parser entry point
# is listed here; `cargo xtask fence` greps the source for parser paths.
disallowed-methods = [
    "std::fs::read",
    "std::fs::read_to_string",
    "std::fs::read_dir",
    "std::fs::write",
    "std::fs::metadata",
    "std::fs::File::open",
    "std::fs::File::create",
    "std::process::Command::new",
    "std::env::var",
    "std::env::var_os",
    "std::env::vars",
    "std::env::current_dir",
    "std::io::stdin",
]

disallowed-types = ["std::fs::File", "std::process::Command"]
