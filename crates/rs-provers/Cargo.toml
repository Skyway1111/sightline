[package]
name = "sightline-rs-provers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust provers for sightline: the body queries every Rust rule asks, and the container holding the Rust oracle"

[lib]
name = "sightline_rs_provers"

[dependencies]
anyhow.workspace = true
camino.workspace = true
indexmap.workspace = true
rayon.workspace = true
regex.workspace = true
serde_json.workspace = true
sha1 = "0.10"
tempfile = "3"
# the toolchain pin table of `sightline.toml`, embedded by `oracle/cargo.rs`
toml.workspace = true
sightline-core = { path = "../core" }
sightline-rs-facts = { path = "../rs-facts" }
# only `oracle/` names the toolchain, and `xtask fence` proves it:
# cargo's JSON streams, and rust-analyzer's crates at the release cut the
# day before the `rust-analyzer 1.95.0` component
cargo_metadata = "0.23"
hir = { package = "ra_ap_hir", version = "=0.0.328" }
ide_db = { package = "ra_ap_ide_db", version = "=0.0.328" }
load_cargo = { package = "ra_ap_load-cargo", version = "=0.0.328" }
proc_macro_api = { package = "ra_ap_proc_macro_api", version = "=0.0.328" }
project_model = { package = "ra_ap_project_model", version = "=0.0.328" }
syntax = { package = "ra_ap_syntax", version = "=0.0.328" }

[dev-dependencies]
sightline-testkit = { path = "../testkit" }

[lints]
workspace = true
