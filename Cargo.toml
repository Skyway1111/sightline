[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Skyway1111/sightline"
# The `rust-toolchain.toml` pin, the only toolchain this workspace is built at.
rust-version = "1.97.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# No debuginfo for dependencies: the ty and ra_ap stacks in debug carry
# tens of GB of it in target/debug/deps, and nothing steps through them.
# Workspace crates keep theirs ("*" matches dependencies only).
[profile.dev.package."*"]
debug = false

# Thin LTO: a faster audit and a smaller binary for a slower clean build.
# The numbers are in benchmarks.md, "Release profile".
[profile.release]
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

# One version per crate for the whole workspace; a crate lists what it uses
# with `workspace = true`.
[workspace.dependencies]
anyhow = "1"
camino = "1"
clap = "4"
indexmap = { version = "2", features = ["serde"] }
memchr = "2"
percent-encoding = "2"
rayon = "1"
regex = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
toml = "0.9"
unicode-ident = "1"
self_cell = "1"

# The ruff and ty crates of the `ty-unnecessary` fork, published on
# crates.io under a `sightline-` prefix with their library names kept: one
# parser serves facts and the oracle. `crates/sightline/src/version.rs`
# repeats the version for `--version`, and a test there pins the two equal.
ruff_db = { package = "sightline-ruff-db", version = "=0.1.0", features = ["os", "cache"] }
ruff_diagnostics = { package = "sightline-ruff-diagnostics", version = "=0.1.0" }
ruff_python_ast = { package = "sightline-ruff-python-ast", version = "=0.1.0" }
ruff_python_codegen = { package = "sightline-ruff-python-codegen", version = "=0.1.0" }
ruff_python_parser = { package = "sightline-ruff-python-parser", version = "=0.1.0" }
ruff_python_stdlib = { package = "sightline-ruff-python-stdlib", version = "=0.1.0" }
ruff_python_trivia = { package = "sightline-ruff-python-trivia", version = "=0.1.0" }
ruff_ranged_value = { package = "sightline-ruff-ranged-value", version = "=0.1.0" }
ruff_source_file = { package = "sightline-ruff-source-file", version = "=0.1.0" }
ruff_text_size = { package = "sightline-ruff-text-size", version = "=0.1.0" }
ty_project = { package = "sightline-ty-project", version = "=0.1.0" }
ty_python_semantic = { package = "sightline-ty-python-semantic", version = "=0.1.0" }
salsa = { version = "0.28.2", default-features = false, features = ["compact_str", "macros", "salsa_unstable", "inventory"] }
