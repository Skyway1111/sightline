name: CI

# `cargo xtask check` does not run here. It reads the six corpus repositories
# as clones under the corpus root (crates/xtask/corpus.toml names the urls),
# pinned, with a .venv in each Python root, which this workflow does not clone
# or provision. Run it locally before you push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
          - name: linux-x64
            runner: ubuntu-latest
          - name: macos-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v7

      # The fork is a git dependency, and one of its snapshot fixtures has a
      # path longer than 260 characters. Without this, libgit2 stops the
      # checkout with "path too long".
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `--cap-lints allow` covers the registry and git dependencies, so
      # `-D warnings` reaches the workspace crates alone. `--locked` on the
      # first cargo command fails the run when Cargo.lock is stale.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The oracle and cargo tests are `#[ignore]`, so this is the unit half.
      - run: cargo test --workspace

      # The binary, on the artifacts the tests left behind. A release build
      # here would compile ty and rust-analyzer a second time, and the release
      # workflow builds the archives anyway.
      - run: cargo run -p sightline -- --version
